name: Build & Deploy

# Push lên main → build bản tĩnh + deploy lên doun.online
# Pull request → chỉ build để kiểm tra, không deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build bản tĩnh
        run: npm run build:static
        env:
          MUSIC_DIR: ./music

      - name: Kiểm tra kết quả build
        run: |
          test -f .output/public/index.html
          n=$(node -p "require('./.output/public/data/tracks.json').length")
          echo "Số bài: $n"
          test "$n" -gt 0

      - uses: actions/upload-artifact@v6
        with:
          name: site
          path: .output/public
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://doun.online
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v6
        with:
          name: site
          path: .output/public

      - name: Deploy lên Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Kiểm tra trang sau deploy
        run: |
          sleep 10
          curl -fsS https://doun.online/data/tracks.json -o /dev/null
          echo "doun.online OK"
